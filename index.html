<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader de Vídeos</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        input { background: #0f172a; border: 1px solid #475569; color: #fff; }
        select { background: #0f172a; border: 1px solid #475569; color: #fff; }
        button { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        #video-details { margin-top: 20px; display: none; }
        img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
        .status { margin-top: 12px; font-size: 14px; color: #94a3b8; text-align: center; }

        /* Estilos da Barra de Progresso */
        .progress-container { width: 100%; background-color: #334155; border-radius: 8px; overflow: hidden; margin-top: 15px; display: none; }
        .progress-bar { width: 0%; height: 16px; background-color: #10b981; transition: width 0.3s ease; }
    </style>
</head>
<body>

<div class="card">
    <h2>Download de Vídeo</h2>
    <input type="text" id="url" placeholder="Cole a URL do vídeo aqui...">
    <button onclick="buscarInfo()" id="btn-buscar">Analisar Vídeo</button>

    <div id="video-details">
        <img id="thumb" src="" alt="Thumbnail">
        <h4 id="title" style="margin: 0 0 10px 0;"></h4>
        
        <label for="resolutions">Selecione a Qualidade:</label>
        <select id="resolutions"></select>
        
        <button onclick="baixarVideo()" id="btn-download" style="background: #16a34a; margin-top: 15px;">Baixar Arquivo</button>
        
        <div class="progress-container" id="prog-box">
            <div class="progress-bar" id="prog-bar"></div>
        </div>
    </div>
    
    <div id="status" class="status"></div>
</div>

<script>
    let currentUrl = "";

    async function buscarInfo() {
        const url = document.getElementById('url').value;
        const status = document.getElementById('status');
        const details = document.getElementById('video-details');
        const select = document.getElementById('resolutions');

        if (!url) return alert("Insira uma URL válida!");

        status.innerText = "Buscando formatos disponíveis...";
        details.style.display = "none";
        select.innerHTML = "";

        try {
            const res = await fetch('/api/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            if (!res.ok) throw new Error("Erro ao obter dados do vídeo.");

            const data = await res.json();
            currentUrl = url;

            document.getElementById('thumb').src = data.thumbnail;
            document.getElementById('title').innerText = data.title;

            data.resolutions.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.innerText = `${r}p (Vídeo + Áudio)`;
                select.appendChild(opt);
            });

            const audioOpt = document.createElement('option');
            audioOpt.value = "audio_only";
            audioOpt.innerText = "Apenas Áudio (.mp3)";
            select.appendChild(audioOpt);

            status.innerText = "";
            details.style.display = "block";
        } catch (err) {
            status.innerText = "Falha ao analisar o vídeo. Verifique a URL.";
        }
    }

    async function baixarVideo() {
        const status = document.getElementById('status');
        const resolution = document.getElementById('resolutions').value;
        const btnDownload = document.getElementById('btn-download');
        const progBox = document.getElementById('prog-box');
        const progBar = document.getElementById('prog-bar');

        // Gera um ID único para acompanhar a tarefa de download
        const taskId = 'task_' + Math.random().toString(36).substr(2, 9);

        progBox.style.display = 'block';
        progBar.style.width = '0%';
        btnDownload.disabled = true;
        status.innerText = "Iniciando download...";

        // Abre a conexão SSE para escutar o progresso do servidor
        const eventSource = new EventSource(`/api/progress/${taskId}`);
        eventSource.onmessage = function(event) {
            const [percent, state] = event.data.split('|');
            progBar.style.width = percent + '%';

            if (state === 'downloading') {
                status.innerText = `Baixando do YouTube: ${percent}%`;
            } else if (state === 'converting') {
                status.innerText = "Mesclando áudio e vídeo com FFmpeg...";
            } else if (state === 'finished' || state === 'error') {
                eventSource.close();
            }
        };

        try {
            const res = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl, resolution, task_id: taskId })
            });

            if (!res.ok) throw new Error("Erro durante o download.");

            const blob = await res.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const disposition = res.headers.get('content-disposition');
            let filename = "download.mp4";
            if (disposition && disposition.includes('filename=')) {
                filename = disposition.split('filename=')[1].replace(/["']/g, '');
            } else if (resolution === "audio_only") {
                filename = "audio.mp3";
            }

            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();

            status.innerText = "Download concluído com sucesso!";
        } catch (err) {
            status.innerText = "Erro ao processar o arquivo.";
        } finally {
            eventSource.close();
            btnDownload.disabled = false;
        }
    }
</script>
</body>
</html>
